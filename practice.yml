name: masud
age: 25
skills:
  - Java
  - Python
  - DevOps
Description: >
  Masud is a software engineer with expertise in Java, Python, and DevOps practices. 
  He has experience in developing scalable applications and implementing CI/CD pipelines.
Department: DevOps
Server: AWS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80